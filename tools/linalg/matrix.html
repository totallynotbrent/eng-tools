<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>matrix operations</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>matrix operations</h1>
      <a class="back" href="../../index.html">&larr; all tools</a>
    </header>

    <div class="section">
      <p class="muted">determinant, inverse, and reduced row echelon form for a 2x2 or 3x3 matrix.</p>

      <div class="field">
        <label>size</label>
        <select id="size">
          <option value="2">2x2</option>
          <option value="3">3x3</option>
        </select>
      </div>

      <div class="field">
        <label>row 1</label>
        <div class="row">
          <input type="number" id="a11" step="any" placeholder="a">
          <input type="number" id="a12" step="any" placeholder="b">
          <input type="number" id="a13" step="any" placeholder="c">
        </div>
      </div>
      <div class="field">
        <label>row 2</label>
        <div class="row">
          <input type="number" id="a21" step="any" placeholder="d">
          <input type="number" id="a22" step="any" placeholder="e">
          <input type="number" id="a23" step="any" placeholder="f">
        </div>
      </div>
      <div class="field">
        <label>row 3 (for 3x3)</label>
        <div class="row">
          <input type="number" id="a31" step="any" placeholder="g">
          <input type="number" id="a32" step="any" placeholder="h">
          <input type="number" id="a33" step="any" placeholder="i">
        </div>
      </div>

      <button onclick="solve_mat()">solve</button>
    </div>

    <div id="err" class="error"></div>

    <div class="results" id="results" style="display:none">
      <h3>results</h3>
      <div id="lines"></div>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script>
    function mat_str(m) {
      return m.map(function (row) { return "[" + row.map(function (x) { return fmt(x, 4); }).join(", ") + "]"; }).join(", ");
    }

    function det2(m) { return m[0][0] * m[1][1] - m[0][1] * m[1][0]; }

    function det3(m) {
      return m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
        - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
        + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    }

    function rref(m) {
      const a = m.map(function (row) { return row.slice(); });
      const nr = a.length, nc = a[0].length;
      let lead = 0;
      for (let r = 0; r < nr; r++) {
        if (lead >= nc) break;
        let i = r;
        while (a[i][lead] === 0) {
          i++;
          if (i === nr) { i = r; lead++; if (lead === nc) break; }
        }
        if (lead >= nc) break;
        const tmp = a[i]; a[i] = a[r]; a[r] = tmp;
        const lv = a[r][lead];
        for (let c = 0; c < nc; c++) a[r][c] /= lv;
        for (let i2 = 0; i2 < nr; i2++) {
          if (i2 === r) continue;
          const f = a[i2][lead];
          for (let c = 0; c < nc; c++) a[i2][c] -= f * a[r][c];
        }
        lead++;
      }
      return a;
    }

    function solve_mat() {
      const err = document.getElementById("err");
      err.textContent = "";
      document.getElementById("results").style.display = "none";

      const size = parseInt(document.getElementById("size").value) || 2;
      const m = [];
      if (size === 2) {
        m.push([val("a11"), val("a12")], [val("a21"), val("a22")]);
      } else {
        m.push([val("a11"), val("a12"), val("a13")],
               [val("a21"), val("a22"), val("a23")],
               [val("a31"), val("a32"), val("a33")]);
      }
      for (const row of m) for (const x of row) if (x === null) { err.textContent = "fill every entry"; return; }

      const d = size === 2 ? det2(m) : det3(m);
      const lines = [["determinant", fmt(d, 6)], ["rref", mat_str(rref(m))]];

      if (Math.abs(d) < 1e-12) {
        lines.push(["inverse", "singular, no inverse"]);
      } else if (size === 2) {
        const inv = [[m[1][1] / d, -m[0][1] / d], [-m[1][0] / d, m[0][0] / d]];
        lines.push(["inverse", mat_str(inv)]);
      } else {
        const inv = [];
        for (let j = 0; j < 3; j++) {
          const e = [0, 0, 0]; e[j] = 1;
          const col = gauss_solve(m, e);
          if (col === null) { lines.push(["inverse", "singular, no inverse"]); break; }
          for (let i = 0; i < 3; i++) inv[i][j] = col[i];
        }
        if (inv.length === 3) lines.push(["inverse", mat_str(inv)]);
      }

      render_lines("lines", lines);
    }
  </script>
</body>
</html>
