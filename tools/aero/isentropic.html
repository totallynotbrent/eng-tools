<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>isentropic flow</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>isentropic flow</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\frac{T_0}{T} = 1 + \frac{\gamma - 1}{2} M^2</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-isentropic"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>mach number M</label>
        <input type="number" id="mach" step="any" value="2" data-solver="solve_isen" class="default-value" data-default="2">
      </div>
      <div class="field">
        <label>ratio of specific heats γ (optional)</label>
        <input type="number" id="gamma" step="any" placeholder="1.4" value="1.4" data-solver="solve_isen" class="default-value" data-default="1.4">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">T / T0</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">P / P0</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">ρ / ρ0</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">A / A*</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="isentropic.js"></script>
</body>
</html>
