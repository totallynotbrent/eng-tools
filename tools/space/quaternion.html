<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>attitude conversions</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>attitude conversions</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-attitude"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">q = \cos\frac{\theta}{2} + \hat{u}\sin\frac{\theta}{2}</div>

      <div class="field">
        <label>quaternion (w, x, y, z)</label>
        <div class="row">
          <input type="number" id="qw" step="any" value="1">
          <input type="number" id="qx" step="any" value="0">
          <input type="number" id="qy" step="any" value="0">
          <input type="number" id="qz" step="any" value="0">
        </div>
      </div>
      <button onclick="quat_to_euler()">quaternion → euler</button>

      <hr style="border:none;border-top:1px solid var(--border);margin:1.2rem 0">

      <div class="field">
        <label>euler angles (roll, pitch, yaw)</label>
        <div class="row">
          <input type="number" id="roll" step="any" value="0">
          <input type="number" id="pitch" step="any" value="0">
          <input type="number" id="yaw" step="any" value="90">
        </div>
      </div>
      <button onclick="euler_to_quat()">euler → quaternion</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">roll</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">pitch</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">yaw</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">quaternion q</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="quaternion.js"></script>
</body>
</html>
