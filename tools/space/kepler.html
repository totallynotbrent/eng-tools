<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kepler's third law</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>kepler's third law</h1>
      <a class="back" href="../../index.html">&larr; all tools</a>
    </header>

    <div class="section">
      <p class="muted">period from semi-major axis or the reverse. leave one blank. T = 2&pi;&radic;(a&sup3;/&mu;).</p>

      <div class="field">
        <label>semi-major axis a</label>
        <input type="number" id="a" step="any" placeholder="m">
      </div>
      <div class="field">
        <label>period T</label>
        <input type="number" id="t" step="any" placeholder="s">
      </div>
      <div class="field">
        <label>gravitational parameter &mu; (optional)</label>
        <input type="number" id="mu" step="any" placeholder="3.986e14">
      </div>

      <button onclick="solve_kepler()">solve</button>
    </div>

    <div id="err" class="error"></div>

    <div class="results" id="results" style="display:none">
      <h3>results</h3>
      <div id="lines"></div>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/nav.js"></script>
  <script>
    function solve_kepler() {
      const err = document.getElementById("err");
      err.textContent = "";
      document.getElementById("results").style.display = "none";

      let a = val("a"), t = val("t"), mu = val("mu") || 3.986e14;
      const known = (a !== null ? 1 : 0) + (t !== null ? 1 : 0);
      if (known !== 1) { err.textContent = "leave exactly one of a and T blank"; return; }
      if (mu <= 0) { err.textContent = "mu must be positive"; return; }

      if (t === null) {
        if (a <= 0) { err.textContent = "a must be positive"; return; }
        t = 2 * Math.PI * Math.sqrt(a * a * a / mu);
      } else {
        if (t <= 0) { err.textContent = "T must be positive"; return; }
        a = Math.pow(mu * Math.pow(t / (2 * Math.PI), 2), 1 / 3);
      }

      render_lines("lines", [
        ["semi-major axis a", fmt(a, 6) + " m"],
        ["period T", fmt(t, 6) + " s (" + fmt(t / 3600, 4) + " h)"]
      ]);
    }
  </script>
</body>
</html>
