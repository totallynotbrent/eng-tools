<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hohmann transfer</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>hohmann transfer</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\Delta v_1 = \sqrt{\frac{\mu}{r_1}}\left(\sqrt{\frac{2 r_2}{r_1 + r_2}} - 1\right)</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-hohmann"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>first orbit radius r1 (m)</label>
        <input type="number" id="r1" step="any" value="6678000" data-solver="solve_hohmann" class="default-value" data-default="6678000">
      </div>
      <div class="field">
        <label>second orbit radius r2 (m)</label>
        <input type="number" id="r2" step="any" value="42164000" data-solver="solve_hohmann" class="default-value" data-default="42164000">
      </div>
      <div class="field">
        <label>gravitational parameter μ (optional)</label>
        <input type="number" id="mu" step="any" placeholder="3.986e14" value="398600441800000" data-solver="solve_hohmann" class="default-value" data-default="398600441800000">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="5">
          <div class="result-line"><span class="label">transfer semi-major axis</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">burn 1 Δv</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">burn 2 Δv</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">total Δv</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">transfer time</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="hohmann.js"></script>
</body>
</html>
