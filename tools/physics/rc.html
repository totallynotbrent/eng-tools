<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rc time constant</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>rc time constant</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>
    <div class="calc-equation">
<div class="eq">V(t) = V_0\, e^{-t/RC}</div>
    </div>
    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-rc"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">
      <div class="field">
        <label>resistance R (Ω)</label>
        <input type="number" id="res" step="any" value="1000" data-solver="solve_rc" class="default-value" data-default="1000">
      </div>
      <div class="field">
        <label>capacitance C</label>
        <input type="number" id="cap" step="any" value="0.001" data-solver="solve_rc" class="default-value" data-default="0.001">
      </div>
      <div class="field">
        <label>initial voltage V0 (optional) (V)</label>
        <input type="number" id="v0" step="any" value="10" data-solver="solve_rc" class="default-value" data-default="10">
      </div>
      <div class="field">
        <label>time t (optional) (s)</label>
        <input type="number" id="tt" step="any" value="1" data-solver="solve_rc" class="default-value" data-default="1">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="3">
          <div class="result-line"><span class="label">time constant τ = RC</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">V at t (charging)</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">V at t (discharging)</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="rc.js"></script>
</body>
</html>
