<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>block diagram reduction</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>block diagram reduction</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>
    <div class="calc-equation">
<div class="eq">G_{series} = G_1 G_2, \quad G_{par} = G_1 + G_2, \quad G_{cl} = \frac{G}{1+G}</div>
    </div>
    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-blocks"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">
      <div class="field">
        <label>structure</label>
        <select id="struct" data-solver="solve_block">
          <option value="series">series: G1 then G2</option>
          <option value="parallel">parallel: G1 + G2</option>
          <option value="feedback">unity feedback around G1</option>
        </select>
      </div>
      <div class="field">
        <label>G1 numerator, highest power first</label>
        <input type="text" id="g1n" value="4" data-solver="solve_block" class="default-value" data-default="4">
      </div>
      <div class="field">
        <label>G1 denominator, highest power first</label>
        <input type="text" id="g1d" value="1, 2, 5" data-solver="solve_block" class="default-value" data-default="1, 2, 5">
      </div>
      <div class="field">
        <label>G2 numerator, highest power first</label>
        <input type="text" id="g2n" value="1" data-solver="solve_block" class="default-value" data-default="1">
      </div>
      <div class="field">
        <label>G2 denominator, highest power first</label>
        <input type="text" id="g2d" value="1, 1" data-solver="solve_block" class="default-value" data-default="1, 1">
      </div>
      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="5">
          <div class="result-line"><span class="label">reduced numerator</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">reduced denominator</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">cancelled factors</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">dc gain</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">poles</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="block-reduction.js"></script>
</body>
</html>
