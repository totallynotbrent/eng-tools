<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>link budget</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>link budget</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">P_r = P_t\, G_t\, G_r \left(\frac{c}{4\pi d f}\right)^2</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-linkbudget"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>transmit power Pt (W)</label>
        <input type="number" id="pt" step="any" value="10" data-solver="solve_link" class="default-value" data-default="10">
      </div>
      <div class="field">
        <label>transmit and receive gain Gt, Gr (linear)</label>
        <div class="row">
          <input type="number" id="gt" step="any" value="100" data-solver="solve_link" class="default-value" data-default="100">
          <input type="number" id="gr" step="any" value="100" data-solver="solve_link" class="default-value" data-default="100">
        </div>
      </div>
      <div class="field">
        <label>distance d (m)</label>
        <input type="number" id="dist" step="any" value="1000" data-solver="solve_link" class="default-value" data-default="1000">
      </div>
      <div class="field">
        <label>frequency f (Hz)</label>
        <input type="number" id="freq" step="any" value="2.4e9" data-solver="solve_link" class="default-value" data-default="2.4e9">
      </div>
      <div class="field">
        <label>system noise temperature Tsys (optional) (K)</label>
        <input type="number" id="tsys" step="any" value="290" data-solver="solve_link" class="default-value" data-default="290">
      </div>
      <div class="field">
        <label>bandwidth B (optional) (Hz)</label>
        <input type="number" id="bw" step="any" value="1e6" data-solver="solve_link" class="default-value" data-default="1e6">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="6">
          <div class="result-line"><span class="label">wavelength λ</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">free-space loss</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">path loss</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">received power Pr</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">C/N0</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">carrier to noise C/N</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="link-budget.js"></script>
</body>
</html>
