<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orbital elements</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>orbital elements</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-orbit"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">h = |\vec{r} \times \vec{v}|, \qquad e = \sqrt{1 + \frac{2 \varepsilon h^2}{\mu^2}}</div>

      <div class="field">
        <label>radius r (m)</label>
        <input type="number" id="r" step="any" value="6771000.0">
      </div>
      <div class="field">
        <label>speed v (m/s)</label>
        <input type="number" id="v" step="any" value="7726">
      </div>
      <div class="field">
        <label>flight path angle γ</label>
        <input type="number" id="gamma" step="any" value="0">
      </div>
      <div class="field">
        <label>gravitational parameter μ (optional)</label>
        <input type="number" id="mu" step="any" placeholder="3.986e14" value="398600441800000.0">
      </div>

      <button class="btn-primary" onclick="solve_elements()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="8">
          <div class="result-line"><span class="label">specific energy ε</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">specific angular momentum h</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">semi-major axis a</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">eccentricity e</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">periapsis rp</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">apoapsis ra</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">period T</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">escape trajectory</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="orbital-elements.js"></script>
</body>
</html>
