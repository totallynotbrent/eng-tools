<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>centroid and moment of inertia</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>centroid and moment of inertia</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\bar{x} = \frac{\sum A_i \bar{x}_i}{\sum A_i}, \qquad I = \sum \left(I_i + A_i d_i^2\right)</div>

      </div><div class="cols calc-layout">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-centroid"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>shape 1</label>
        <select id="type1" data-solver="solve_centroid"><option value="rect">rectangle</option><option value="circle">circle</option><option value="tri">triangle</option></select>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="d1a" step="any" value="2" data-solver="solve_centroid" class="default-value" data-default="2">
          <input type="number" id="d1b" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
        </div>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="cx1" step="any" value="0.5" data-solver="solve_centroid" class="default-value" data-default="0.5">
          <input type="number" id="cy1" step="any" value="0.5" data-solver="solve_centroid" class="default-value" data-default="0.5">
        </div>
      </div>

      <div class="field">
        <label>shape 2</label>
        <select id="type2" data-solver="solve_centroid"><option value="rect">rectangle</option><option value="circle">circle</option><option value="tri">triangle</option></select>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="d2a" step="any" value="2" data-solver="solve_centroid" class="default-value" data-default="2">
          <input type="number" id="d2b" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
        </div>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="cx2" step="any" value="2.5" data-solver="solve_centroid" class="default-value" data-default="2.5">
          <input type="number" id="cy2" step="any" value="0.5" data-solver="solve_centroid" class="default-value" data-default="0.5">
        </div>
      </div>

      <div class="field">
        <label>shape 3</label>
        <select id="type3" data-solver="solve_centroid"><option value="rect">rectangle</option><option value="circle">circle</option><option value="tri">triangle</option></select>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="d3a" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
          <input type="number" id="d3b" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
        </div>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="cx3" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
          <input type="number" id="cy3" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
        </div>
      </div>

      <div class="field">
        <label>shape 4</label>
        <select id="type4" data-solver="solve_centroid"><option value="rect">rectangle</option><option value="circle">circle</option><option value="tri">triangle</option></select>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="d4a" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
          <input type="number" id="d4b" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
        </div>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="cx4" step="any" value="2" data-solver="solve_centroid" class="default-value" data-default="2">
          <input type="number" id="cy4" step="any" value="1" data-solver="solve_centroid" class="default-value" data-default="1">
        </div>
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="3">
          <div class="result-line"><span class="label">total area</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">radius of gyration x</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">radius of gyration y</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="centroid.js"></script>
</body>
</html>
