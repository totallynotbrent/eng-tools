<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>impulse and momentum</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>impulse and momentum</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-impulse"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">\vec{J} = \int \vec{F}\,dt = m\vec{v}_2 - m\vec{v}_1</div>

      <div class="field">
        <label>mass m (kg)</label>
        <input type="number" id="mass" step="any" value="2">
      </div>
      <div class="field">
        <label>initial velocity vi (m/s)</label>
        <input type="number" id="vi" step="any" value="3">
      </div>
      <div class="field">
        <label>final velocity vf (m/s)</label>
        <input type="number" id="vf" step="any" value="7">
      </div>

      <div class="field">
        <label>force F and time Δt (optional, gives J = FΔt)</label>
        <div class="row">
          <input type="number" id="force" step="any" value="100">
          <input type="number" id="dt" step="any" value="0.5">
        </div>
      </div>

      <button class="btn-primary" onclick="solve_impulse()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">change in velocity Δv</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">momentum change Δp</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">impulse J</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">J from FΔt</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="impulse-momentum.js"></script>
</body>
</html>
