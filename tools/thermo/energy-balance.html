<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>energy balance</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>energy balance</h1>
      <a class="back" href="../../index.html">&larr; all tools</a>
    </header>

    <p class="muted">sign convention: Q is positive into the system, W is positive leaving it.</p>

    <div class="tabs" id="tabs">
      <span class="tab active" data-mode="closed">closed system</span>
      <span class="tab" data-mode="flow">steady flow</span>
    </div>

    <div class="section" id="panel_closed">
      <h2>closed system</h2>
      <div class="field">
        <label>mass m</label>
        <input type="number" id="m" placeholder="kg" step="any">
      </div>
      <div class="field">
        <label>energy change mode</label>
        <select id="emode" onchange="emode_ui()">
          <option value="u">internal energies u1, u2</option>
          <option value="gas">ideal gas cv, T1, T2</option>
        </select>
      </div>
      <div id="fields_u">
        <div class="field">
          <label>u1</label>
          <input type="number" id="u1" placeholder="kJ/kg" step="any">
        </div>
        <div class="field">
          <label>u2</label>
          <input type="number" id="u2" placeholder="kJ/kg" step="any">
        </div>
      </div>
      <div id="fields_gas" style="display:none">
        <div class="field">
          <label>cv</label>
          <input type="number" id="cv" placeholder="kJ/(kg&middot;K)" step="any">
        </div>
        <div class="field">
          <label>T1</label>
          <input type="number" id="t1" placeholder="K" step="any">
        </div>
        <div class="field">
          <label>T2</label>
          <input type="number" id="t2" placeholder="K" step="any">
        </div>
      </div>
      <div class="field">
        <label>heat Q (leave blank to solve)</label>
        <input type="number" id="q" placeholder="kJ" step="any">
      </div>
      <div class="field">
        <label>work W (leave blank to solve)</label>
        <input type="number" id="w" placeholder="kJ" step="any">
      </div>
      <button onclick="solve_closed()">solve</button>
    </div>

    <div class="section" id="panel_flow" style="display:none">
      <h2>steady flow</h2>
      <div class="field">
        <label>h1, h2</label>
        <div class="row">
          <input type="number" id="h1" placeholder="h1 kJ/kg" step="any">
          <input type="number" id="h2" placeholder="h2 kJ/kg" step="any">
        </div>
      </div>
      <div class="field">
        <label>velocity V1, V2</label>
        <div class="row">
          <input type="number" id="v1" placeholder="V1 m/s" step="any">
          <input type="number" id="v2" placeholder="V2 m/s" step="any">
        </div>
      </div>
      <div class="field">
        <label>elevation z1, z2</label>
        <div class="row">
          <input type="number" id="z1" placeholder="z1 m" step="any">
          <input type="number" id="z2" placeholder="z2 m" step="any">
        </div>
      </div>
      <div class="field">
        <label>gravity g</label>
        <input type="number" id="g" value="9.81" step="any">
      </div>
      <div class="field">
        <label>heat q (leave blank to solve)</label>
        <input type="number" id="qf" placeholder="kJ/kg" step="any">
      </div>
      <div class="field">
        <label>work w (leave blank to solve)</label>
        <input type="number" id="wf" placeholder="kJ/kg" step="any">
      </div>
      <button onclick="solve_flow()">solve</button>
    </div>

    <div id="err" class="error"></div>

    <div class="results" id="results" style="display:none">
      <h3>results</h3>
      <div id="lines"></div>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script>
    function emode_ui() {
      const gas = document.getElementById("emode").value === "gas";
      document.getElementById("fields_u").style.display = gas ? "none" : "block";
      document.getElementById("fields_gas").style.display = gas ? "block" : "none";
    }

    function render(lines) {
      document.getElementById("lines").innerHTML = lines.map(function (l) {
        return '<div class="result-line"><span class="label">' + l[0] + "</span><span class=\"value\">" + l[1] + "</span></div>";
      }).join("");
      document.getElementById("results").style.display = "block";
    }

    function solve_closed() {
      const err = document.getElementById("err");
      err.textContent = "";
      const m = val("m");
      if (m === null) { err.textContent = "enter mass"; return; }

      let du;
      if (document.getElementById("emode").value === "gas") {
        const cv = val("cv"), t1 = val("t1"), t2 = val("t2");
        if (cv === null || t1 === null || t2 === null) { err.textContent = "enter cv, T1, T2"; return; }
        du = m * cv * (t2 - t1);
      } else {
        const u1 = val("u1"), u2 = val("u2");
        if (u1 === null || u2 === null) { err.textContent = "enter u1 and u2"; return; }
        du = m * (u2 - u1);
      }

      const q = val("q"), w = val("w");
      let out_q = q, out_w = w;
      if (q === null && w === null) { err.textContent = "leave exactly one of Q, W blank"; return; }
      if (q === null) out_q = du + w;
      if (w === null) out_w = q - du;

      if (!isFinite(out_q) || !isFinite(out_w)) { err.textContent = "bad inputs"; return; }

      const lines = [
        ["&Delta;U = m(u2 &minus; u1)", fmt(du, 6) + " kJ"],
        ["heat Q", fmt(out_q, 6) + " kJ"],
        ["work W", fmt(out_w, 6) + " kJ"]
      ];
      if (q !== null && w !== null) {
        const net = q - w;
        lines.push(["Q &minus; W", fmt(net, 6) + " kJ"]);
        lines.push(["check vs &Delta;U", Math.abs(net - du) < 1e-6 * Math.max(1, Math.abs(du)) ? "balances" : "does not balance"]);
      }
      render(lines);
    }

    function solve_flow() {
      const err = document.getElementById("err");
      err.textContent = "";
      const h1 = val("h1"), h2 = val("h2");
      const v1 = val("v1"), v2 = val("v2");
      const z1 = val("z1"), z2 = val("z2");
      const g = val("g");
      if (h1 === null || h2 === null || v1 === null || v2 === null || z1 === null || z2 === null || g === null) {
        err.textContent = "fill every state field"; return;
      }

      const dh = h2 - h1;
      const dke = (v2 * v2 - v1 * v1) / 2000;
      const dpe = g * (z2 - z1) / 1000;
      const sum = dh + dke + dpe;

      const q = val("qf"), w = val("wf");
      let out_q = q, out_w = w;
      if (q === null && w === null) { err.textContent = "leave exactly one of q, w blank"; return; }
      if (q === null) out_q = sum + w;
      if (w === null) out_w = q - sum;

      const lines = [
        ["&Delta;h", fmt(dh, 6) + " kJ/kg"],
        ["&Delta;ke", fmt(dke, 6) + " kJ/kg"],
        ["&Delta;pe", fmt(dpe, 6) + " kJ/kg"],
        ["q &minus; w", fmt(sum, 6) + " kJ/kg"],
        ["heat q", fmt(out_q, 6) + " kJ/kg"],
        ["work w", fmt(out_w, 6) + " kJ/kg"]
      ];
      render(lines);
    }

    document.getElementById("tabs").addEventListener("click", function (e) {
      const tab = e.target.closest(".tab");
      if (!tab) return;
      const mode = tab.getAttribute("data-mode");
      document.querySelectorAll(".tab").forEach(function (el) { el.classList.remove("active"); });
      tab.classList.add("active");
      document.getElementById("panel_closed").style.display = mode === "closed" ? "block" : "none";
      document.getElementById("panel_flow").style.display = mode === "flow" ? "block" : "none";
      document.getElementById("err").textContent = "";
      document.getElementById("results").style.display = "none";
    });
  </script>
</body>
</html>
