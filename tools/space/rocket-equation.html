<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rocket equation</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>rocket equation</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\Delta v = v_e \ln\frac{m_0}{m_f}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-rocket"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>exhaust velocity ve (or Isp · g) (m/s)</label>
        <input type="number" id="ve" step="any" value="3000" data-solver="solve_rocket" class="default-value" data-default="3000">
      </div>
      <div class="field">
        <label>initial mass m0 (kg)</label>
        <input type="number" id="m0" step="any" value="1000" data-solver="solve_rocket" class="default-value" data-default="1000">
      </div>
      <div class="field">
        <label>final mass mf (kg)</label>
        <input type="number" id="mf" step="any" value="200" data-solver="solve_rocket" class="default-value" data-default="200">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="2">
          <div class="result-line"><span class="label">mass ratio m0/mf</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">propellant mass</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="rocket-equation.js"></script>
</body>
</html>
