<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>linear system solver</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>linear system solver</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-ls"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">A\vec{x} = \vec{b}</div>

      <div class="field">
        <label>size</label>
        <select id="size">
          <option value="2">2x2</option>
          <option value="3">3x3</option>
        </select>
      </div>

      <div class="field">
        <label>matrix A (row 1)</label>
        <div class="row">
          <input type="number" id="a11" step="any" value="2">
          <input type="number" id="a12" step="any" value="1">
          <input type="number" id="a13" step="any" value="0">
        </div>
      </div>
      <div class="field">
        <label>row 2</label>
        <div class="row">
          <input type="number" id="a21" step="any" value="1">
          <input type="number" id="a22" step="any" placeholder="e" value="3">
          <input type="number" id="a23" step="any" value="0">
        </div>
      </div>
      <div class="field">
        <label>row 3 (for 3x3) (g)</label>
        <div class="row">
          <input type="number" id="a31" step="any" value="0">
          <input type="number" id="a32" step="any" value="0">
          <input type="number" id="a33" step="any" value="1">
        </div>
      </div>
      <div class="field">
        <label>vector b</label>
        <div class="row">
          <input type="number" id="b1" step="any" value="5">
          <input type="number" id="b2" step="any" value="10">
          <input type="number" id="b3" step="any" value="0">
        </div>
      </div>

      <button class="btn-primary" onclick="solve_ls()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="3">
          <div class="result-line"><span class="label">x1</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">x2</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">x3</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="linear-solver.js"></script>
</body>
</html>
