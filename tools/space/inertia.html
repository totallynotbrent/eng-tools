<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inertia tensor</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>inertia tensor</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\vec{H} = [I]\,\vec{\omega}</div>

      </div><div class="cols calc-layout">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-principal"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>row 1 (Ixx, Ixy, Ixz)</label>
        <div class="row">
          <input type="number" id="i11" step="any" value="10" data-solver="solve_inertia" class="default-value" data-default="10">
          <input type="number" id="i12" step="any" value="0" data-solver="solve_inertia" class="default-value" data-default="0">
          <input type="number" id="i13" step="any" value="0" data-solver="solve_inertia" class="default-value" data-default="0">
        </div>
      </div>
      <div class="field">
        <label>row 2 (Ixy, Iyy, Iyz)</label>
        <div class="row">
          <input type="number" id="i21" step="any" value="0" data-solver="solve_inertia" class="default-value" data-default="0">
          <input type="number" id="i22" step="any" value="20" data-solver="solve_inertia" class="default-value" data-default="20">
          <input type="number" id="i23" step="any" value="0" data-solver="solve_inertia" class="default-value" data-default="0">
        </div>
      </div>
      <div class="field">
        <label>row 3 (Ixz, Iyz, Izz)</label>
        <div class="row">
          <input type="number" id="i31" step="any" value="0" data-solver="solve_inertia" class="default-value" data-default="0">
          <input type="number" id="i32" step="any" value="0" data-solver="solve_inertia" class="default-value" data-default="0">
          <input type="number" id="i33" step="any" value="30" data-solver="solve_inertia" class="default-value" data-default="30">
        </div>
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="6">
          <div class="result-line"><span class="label">I1</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">axis 1</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">I2</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">axis 2</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">I3</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">axis 3</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="inertia.js"></script>
</body>
</html>
