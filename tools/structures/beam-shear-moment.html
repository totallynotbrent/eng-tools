<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beam shear and moment</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>beam shear and moment</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">V(x) = R_A - \sum_{x_i \le x} P_i, \qquad M(x) = \int_0^x V\,dx</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-beam"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>span L (m)</label>
        <input type="number" id="len" step="any" value="10" data-solver="solve_beam" class="default-value" data-default="10">
      </div>
      <div class="field">
        <label>point loads (magnitude, distance; one per line)</label>
        <textarea id="point" rows="3" placeholder="1000 2
500 4" data-solver="solve_beam"></textarea>
      </div>
      <div class="field">
        <label>uniform load w over the full span (optional) (N/m)</label>
        <input type="number" id="udl" step="any" value="100" data-solver="solve_beam" class="default-value" data-default="100">
      </div>
      <div class="field">
        <label>positions to evaluate (comma separated, optional)</label>
        <input type="text" id="xs" value="5" data-solver="solve_beam" class="default-value" data-default="5">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="2">
          <div class="result-line"><span class="label">reaction at A (Ra)</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">reaction at B (Rb)</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="beam-shear-moment.js"></script>
</body>
</html>
