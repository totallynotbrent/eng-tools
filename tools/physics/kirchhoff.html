<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kirchhoff solver</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>kirchhoff solver</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\sum I_{\mathrm{in}} = \sum I_{\mathrm{out}}, \qquad \sum V = 0</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-kirchhoff"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>nodes (one per line: node id, marker optional)</label>
        <textarea id="nodes" rows="4" data-solver="solve_kirchhoff">1
2</textarea>
      </div>
      <div class="field">
        <label>resistors (nodeA nodeB resistance)</label>
        <textarea id="resistors" rows="4" data-solver="solve_kirchhoff">1 0 10
2 0 10
1 2 10</textarea>
      </div>
      <div class="field">
        <label>voltage sources (fromNode toNode volts)</label>
        <textarea id="sources" rows="2" data-solver="solve_kirchhoff"></textarea>
      </div>
      <div class="field">
        <label>ground node id (default 0)</label>
        <input type="number" id="ground" step="any" value="0" data-solver="solve_kirchhoff" class="default-value" data-default="0">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="1">
          <div class="result-line"><span class="label">node voltages</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="kirchhoff.js"></script>
</body>
</html>
