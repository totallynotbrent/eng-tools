<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projectile motion</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>projectile motion</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">R = \frac{v_0^2 \sin 2\theta}{g}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-projectile"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>launch speed v0 (m/s)</label>
        <input type="number" id="v0" step="any" value="20" data-solver="solve_proj" class="default-value" data-default="20">
      </div>
      <div class="field">
        <label>launch angle θ</label>
        <input type="number" id="angle" step="any" value="45" data-solver="solve_proj" class="default-value" data-default="45">
      </div>
      <div class="field">
        <label>initial height h0 (m)</label>
        <input type="number" id="h0" step="any" value="0" data-solver="solve_proj" class="default-value" data-default="0">
      </div>
      <div class="field">
        <label>gravity g</label>
        <input type="number" id="grav" step="any" value="9.81" data-solver="solve_proj" class="default-value" data-default="9.81">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="5">
          <div class="result-line"><span class="label">horizontal vx</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">vertical vy</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">flight time</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">range</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">max height</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="projectile.js"></script>
</body>
</html>
