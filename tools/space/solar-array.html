<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>solar array budget</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>solar array budget</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">P_{\mathrm{eol}} = P_0 (1 - d)^n</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-solar"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>beginning-of-life power P0 (W)</label>
        <input type="number" id="p0" step="any" value="100" data-solver="solve_solar" class="default-value" data-default="100">
      </div>
      <div class="field">
        <label>annual degradation per year (fraction, optional)</label>
        <input type="number" id="deg" step="any" placeholder="0.028" value="0.028" data-solver="solve_solar" class="default-value" data-default="0.028">
      </div>
      <div class="field">
        <label>mission life (years)</label>
        <input type="number" id="years" step="any" value="10" data-solver="solve_solar" class="default-value" data-default="10">
      </div>
      <div class="field">
        <label>average load (optional) (W)</label>
        <input type="number" id="load" step="any" value="800" data-solver="solve_solar" class="default-value" data-default="800">
      </div>
      <div class="field">
        <label>cell efficiency η and solar flux S (optional, gives area)</label>
        <div class="row">
          <input type="number" id="eta" step="any" value="0.85" data-solver="solve_solar" class="default-value" data-default="0.85">
          <input type="number" id="flux" step="any" value="1361" data-solver="solve_solar" class="default-value" data-default="1361">
        </div>
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">EOL power</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">power lost</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">EOL margin</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">array area for P0</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="solar-array.js"></script>
</body>
</html>
