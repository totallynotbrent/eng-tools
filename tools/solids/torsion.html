<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>torsion</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>torsion</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\tau_{\max} = \frac{T r}{J}, \qquad J = \frac{\pi r^4}{2}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-torsion"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>torque T (N·m)</label>
        <input type="number" id="torque" step="any" value="100" data-solver="solve_torsion" class="default-value" data-default="100">
      </div>
      <div class="field">
        <label>length L (m)</label>
        <input type="number" id="length" step="any" value="2" data-solver="solve_torsion" class="default-value" data-default="2">
      </div>
      <div class="field">
        <label>shear modulus G (Pa)</label>
        <input type="number" id="shear" step="any" value="80000000" data-solver="solve_torsion" class="default-value" data-default="80000000">
      </div>
      <div class="field">
        <label>shaft radius r (m)</label>
        <input type="number" id="radius" step="any" value="0.05" data-solver="solve_torsion" class="default-value" data-default="0.05">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="3">
          <div class="result-line"><span class="label">polar moment J</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">angle of twist φ</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">max shear τmax</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="torsion.js"></script>
</body>
</html>
