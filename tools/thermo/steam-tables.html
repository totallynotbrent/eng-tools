<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>steam tables</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>steam tables</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>
    <div class="calc-equation">
<div class="eq">y = y_0 + (y_1 - y_0)\frac{x - x_0}{x_1 - x_0}</div>
    </div>
    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-steam"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area calc-sections-3 calc-has-tabs">
<div class="tabs calc-tabs" id="tabs">
      <span class="tab active" data-mode="satT">saturated (temperature)</span>
      <span class="tab" data-mode="satP">saturated (pressure)</span>
      <span class="tab" data-mode="super">superheated</span>
    </div>
<div class="section calc-section" id="panel_satT">
      <h2>saturated, by temperature</h2>
      <div class="field">
        <label>temperature T (°C)</label>
        <input type="number" id="sat_t" step="any" value="100" data-solver="sat_temp" class="default-value" data-default="100">
      </div>
      <div class="field">
        <label>quality x (optional, 0–1)</label>
        <input type="number" id="sat_t_x" step="any" min="0" max="1" value="0.4" data-solver="sat_temp" class="default-value" data-default="0.4">
      </div>
      </div>
<div class="section calc-section" id="panel_satP" style="display:none">
      <h2>saturated, by pressure</h2>
      <div class="field">
        <label>pressure p (kPa)</label>
        <input type="number" id="sat_p" step="any" value="101.325" data-solver="sat_press" class="default-value" data-default="101.325">
      </div>
      <div class="field">
        <label>quality x (optional, 0–1)</label>
        <input type="number" id="sat_p_x" step="any" min="0" max="1" value="0.5" data-solver="sat_press" class="default-value" data-default="0.5">
      </div>
      </div>
<div class="section calc-section" id="panel_super" style="display:none">
      <h2>superheated vapor</h2>
      <div class="field">
        <label>pressure p (MPa)</label>
        <input type="number" id="sup_p" step="any" value="0.1" data-solver="superheat" class="default-value" data-default="0.1">
      </div>
      <div class="field">
        <label>temperature T (°C)</label>
        <input type="number" id="sup_t" step="any" value="200" data-solver="superheat" class="default-value" data-default="200">
      </div>
      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="14">
          <div class="result-line"><span class="label">p_sat</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">T_sat</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">vf</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">vg</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">v_fg</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">uf</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">ug</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">u_fg</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">hf</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">hg</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">h_fg</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">sf</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">sg</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">s_fg</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="steam-data.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="steam-tables.js"></script>
</body>
</html>
