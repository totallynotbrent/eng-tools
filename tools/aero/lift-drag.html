<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lift and drag</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>lift and drag</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-liftdrag"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">q = \tfrac{1}{2}\rho V^2, \qquad L = q\,S\,C_L, \qquad D = q\,S\,C_D</div>

      <div class="field">
        <label>density ρ</label>
        <input type="number" id="rho" step="any" value="1.225">
      </div>
      <div class="field">
        <label>velocity V (m/s)</label>
        <input type="number" id="vel" step="any" value="50">
      </div>
      <div class="field">
        <label>wing area S (m²)</label>
        <input type="number" id="area" step="any" value="5">
      </div>
      <div class="field">
        <label>lift coefficient CL</label>
        <input type="number" id="cl" step="any" value="0.5">
      </div>
      <div class="field">
        <label>drag coefficient CD (direct, optional)</label>
        <input type="number" id="cd" step="any" value="0.02">
      </div>
      <div class="field">
        <label>polar CD0 and k (used if CD is blank)</label>
        <div class="row">
          <input type="number" id="cd0" step="any" value="0.02">
          <input type="number" id="k" step="any" value="0.05">
        </div>
      </div>

      <button class="btn-primary" onclick="solve_ld()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">dynamic pressure q</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">lift L</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">drag D</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">lift to drag L/D</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="lift-drag.js"></script>
</body>
</html>
