<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vector operations</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>vector operations</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-vec"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">\vec{a}\cdot\vec{b} = ab\cos\theta</div>

      <div class="field">
        <label>vector a (ax, ay, az)</label>
        <div class="row">
          <input type="number" id="ax" step="any" value="2">
          <input type="number" id="ay" step="any" value="-1">
          <input type="number" id="az" step="any" value="3">
        </div>
      </div>

      <div class="field">
        <label>vector b (bx, by, bz)</label>
        <div class="row">
          <input type="number" id="bx" step="any" value="1">
          <input type="number" id="by" step="any" value="4">
          <input type="number" id="bz" step="any" value="-2">
        </div>
      </div>

      <button class="btn-primary" onclick="solve_vec()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="7">
          <div class="result-line"><span class="label">|a|</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">|b|</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">a × b</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">|a × b|</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">projection of a onto b</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">projection components</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">angle between</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="vectors.js"></script>
</body>
</html>
