<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>axial and thermal deformation</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>axial and thermal deformation</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-axial"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">\delta = \frac{F L}{A E} + \alpha L \Delta T</div>

      <div class="field">
        <label>axial load P (N)</label>
        <input type="number" id="load" step="any" value="10000">
      </div>
      <div class="field">
        <label>length L (m)</label>
        <input type="number" id="length" step="any" value="2">
      </div>
      <div class="field">
        <label>area A (m²)</label>
        <input type="number" id="area" step="any" value="0.001">
      </div>
      <div class="field">
        <label>young's modulus E (Pa)</label>
        <input type="number" id="modulus" step="any" value="200000000000">
      </div>
      <div class="field">
        <label>coefficient of thermal expansion α</label>
        <input type="number" id="alpha" step="any" value="0">
      </div>
      <div class="field">
        <label>temperature change ΔT (°C)</label>
        <input type="number" id="dt" step="any" value="0">
      </div>

      <button class="btn-primary" onclick="solve_axial()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">mechanical δ</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">thermal δ</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">total δ</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">axial stress σ</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="axial-thermal.js"></script>
</body>
</html>
