<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oblique shock</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>oblique shock</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-polar"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">\tan\theta = \frac{2\cot\beta\left(M_1^2\sin^2\beta - 1\right)}{M_1^2\left(\gamma + \cos 2\beta\right) + 2}</div>

      <div class="field">
        <label>upstream mach M1</label>
        <input type="number" id="m1" step="any" value="2.5">
      </div>
      <div class="field">
        <label>deflection angle θ (deg)</label>
        <input type="number" id="theta" step="any" value="15">
      </div>
      <div class="field">
        <label>ratio of specific heats γ (optional)</label>
        <input type="number" id="gamma" step="any" placeholder="1.4" value="1.4">
      </div>
      <div class="field">
        <label>solution branch</label>
        <select id="branch">
          <option value="weak">weak (supersonic downstream)</option>
          <option value="strong">strong (subsonic downstream)</option>
        </select>
      </div>

      <button class="btn-primary" onclick="solve_oblique()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="5">
          <div class="result-line"><span class="label">wave angle β</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">downstream mach M2</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">pressure ratio P2/P1</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">density ratio ρ2/ρ1</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">temperature ratio T2/T1</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="oblique-shock.js"></script>
</body>
</html>
