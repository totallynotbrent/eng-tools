<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eigenvalues and vectors</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>eigenvalues and vectors</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">A\vec{v} = \lambda\vec{v}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-eig"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>matrix entries</label>
        <div class="row">
          <input type="number" id="a11" step="any" value="2" data-solver="solve_eig" class="default-value" data-default="2">
          <input type="number" id="a12" step="any" value="1" data-solver="solve_eig" class="default-value" data-default="1">
        </div>
        <div class="row" style="margin-top:0.4rem">
          <input type="number" id="a21" step="any" value="1" data-solver="solve_eig" class="default-value" data-default="1">
          <input type="number" id="a22" step="any" value="2" data-solver="solve_eig" class="default-value" data-default="2">
        </div>
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="7">
          <div class="result-line"><span class="label">trace</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">determinant</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">λ1</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">λ2</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">v1</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">v2</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">complex pair</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="eigenvalues.js"></script>
</body>
</html>
