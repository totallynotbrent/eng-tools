<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orbital elements</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>orbital elements</h1>
      <a class="back" href="../../index.html">&larr; all tools</a>
    </header>

    <div class="section">
      <p class="muted">shape of the orbit from a single point: radius, speed, and flight path angle. elliptic assumption.</p>

      <div class="field">
        <label>radius r</label>
        <input type="number" id="r" step="any" placeholder="m">
      </div>
      <div class="field">
        <label>speed v</label>
        <input type="number" id="v" step="any" placeholder="m/s">
      </div>
      <div class="field">
        <label>flight path angle &gamma;</label>
        <input type="number" id="gamma" step="any" placeholder="deg" value="0">
      </div>
      <div class="field">
        <label>gravitational parameter &mu; (optional)</label>
        <input type="number" id="mu" step="any" placeholder="3.986e14">
      </div>

      <button onclick="solve_elements()">solve</button>
    </div>

    <div id="err" class="error"></div>

    <div class="results" id="results" style="display:none">
      <h3>results</h3>
      <div id="lines"></div>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/nav.js"></script>
  <script>
    function solve_elements() {
      const err = document.getElementById("err");
      err.textContent = "";
      document.getElementById("results").style.display = "none";

      const r = val("r"), v = val("v"), gamma = (val("gamma") || 0) * Math.PI / 180;
      const mu = val("mu") || 3.986e14;
      if (r === null || v === null) { err.textContent = "fill r and v"; return; }
      if (r <= 0 || mu <= 0) { err.textContent = "r and mu must be positive"; return; }

      const eps = v * v / 2 - mu / r;
      const h = r * v * Math.cos(gamma);
      const a = -mu / (2 * eps);
      const e2 = 1 + 2 * eps * h * h / (mu * mu);
      if (e2 < 0) { err.textContent = "unphysical state, check r, v, and gamma"; return; }
      const e = Math.sqrt(e2);

      const lines = [
        ["specific energy &epsilon;", fmt(eps, 6) + " J/kg"],
        ["specific angular momentum h", fmt(h, 6) + " m&sup2;/s"],
        ["semi-major axis a", fmt(a, 6) + " m"],
        ["eccentricity e", fmt(e, 6)]
      ];
      if (e < 1 && a > 0) {
        lines.push(["periapsis rp", fmt(a * (1 - e), 6) + " m"]);
        lines.push(["apoapsis ra", fmt(a * (1 + e), 6) + " m"]);
        lines.push(["period T", fmt(2 * Math.PI * Math.sqrt(a * a * a / mu), 6) + " s"]);
      } else {
        lines.push(["escape trajectory", "e >= 1, no bound orbit"]);
      }

      render_lines("lines", lines);
    }
  </script>
</body>
</html>
