<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pole placement</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>pole placement</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>
    <div class="calc-equation">
<div class="eq">u = -Kx, \qquad K = e_n^T \mathcal{C}^{-1} \phi(A)</div>
    </div>
    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-poles"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">
      <div class="field">
        <label>matrix size n (2 or 3)</label>
        <input type="number" id="n" step="1" min="2" max="3" value="2">
      </div>
      <div class="field">
        <label>A rows, semicolon separated</label>
        <input type="text" id="a_mat" value="0 1; -2 -3">
      </div>
      <div class="field">
        <label>B rows, semicolon separated</label>
        <input type="text" id="b_mat" value="0; 1">
      </div>
      <div class="field">
        <label>desired real parts of the poles</label>
        <input type="text" id="poles" value="-1 -2">
      </div>
      <button class="btn-primary" onclick="solve_pp()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">gain K</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">closed-loop char poly</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">closed-loop eigs</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">max placement error</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="pole-placement.js"></script>
</body>
</html>
