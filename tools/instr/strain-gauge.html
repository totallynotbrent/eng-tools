<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>strain gauge</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>strain gauge</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\varepsilon = \frac{\Delta L}{L} = \frac{1}{GF}\frac{\Delta R}{R}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-gauge"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>bridge configuration</label>
        <select id="config" data-solver="solve_gauge">
          <option value="quarter">quarter bridge</option>
          <option value="half">half bridge</option>
          <option value="full">full bridge</option>
        </select>
      </div>
      <div class="field">
        <label>gauge factor GF</label>
        <input type="number" id="gf" step="any" value="2" data-solver="solve_gauge" class="default-value" data-default="2">
      </div>
      <div class="field">
        <label>output to excitation ratio Vout/Vex</label>
        <input type="number" id="ratio" step="any" value="0.005" data-solver="solve_gauge" class="default-value" data-default="0.005">
      </div>
      <div class="field">
        <label>young's modulus E (optional) (Pa)</label>
        <input type="number" id="e_mod" step="any" value="200000000000" data-solver="solve_gauge" class="default-value" data-default="200000000000">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="2">
          <div class="result-line"><span class="label">strain ε</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">stress σ</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="strain-gauge.js"></script>
</body>
</html>
