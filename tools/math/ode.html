<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>differential equations</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>differential equations</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\frac{dy}{dt} = f(t, y)</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-ode"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>coefficient a and constant b</label>
        <div class="row">
          <input type="number" id="coef" step="any" value="1" data-solver="solve_ode" class="default-value" data-default="1">
          <input type="number" id="const" step="any" value="0" data-solver="solve_ode" class="default-value" data-default="0">
        </div>
      </div>
      <div class="field">
        <label>initial value y0 and start time t0</label>
        <div class="row">
          <input type="number" id="y0" step="any" value="1" data-solver="solve_ode" class="default-value" data-default="1">
          <input type="number" id="t0" step="any" value="0" data-solver="solve_ode" class="default-value" data-default="0">
        </div>
      </div>
      <div class="field">
        <label>end time tf and steps n</label>
        <div class="row">
          <input type="number" id="tf" step="any" value="1" data-solver="solve_ode" class="default-value" data-default="1">
          <input type="number" id="steps" step="any" value="10" data-solver="solve_ode" class="default-value" data-default="10">
        </div>
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">step size h</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">exact y(tf)</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">euler y(tf)</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">rk4 y(tf)</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="ode.js"></script>
</body>
</html>
