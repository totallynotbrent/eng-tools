<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>attitude conversions</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>attitude conversions</h1>
      <a class="back" href="../../index.html">&larr; all tools</a>
    </header>

    <div class="section">
      <p class="muted">quaternion to euler angles (3-2-1) and back. quaternion is scalar-first, q = [w, x, y, z].</p>

      <div class="field">
        <label>quaternion (w, x, y, z)</label>
        <div class="row">
          <input type="number" id="qw" step="any" placeholder="w">
          <input type="number" id="qx" step="any" placeholder="x">
          <input type="number" id="qy" step="any" placeholder="y">
          <input type="number" id="qz" step="any" placeholder="z">
        </div>
      </div>
      <button onclick="quat_to_euler()">quaternion &rarr; euler</button>

      <hr style="border:none;border-top:1px solid var(--border);margin:1.2rem 0">

      <div class="field">
        <label>euler angles (roll, pitch, yaw)</label>
        <div class="row">
          <input type="number" id="roll" step="any" placeholder="roll &deg;">
          <input type="number" id="pitch" step="any" placeholder="pitch &deg;">
          <input type="number" id="yaw" step="any" placeholder="yaw &deg;">
        </div>
      </div>
      <button onclick="euler_to_quat()">euler &rarr; quaternion</button>
    </div>

    <div id="err" class="error"></div>

    <div class="results" id="results" style="display:none">
      <h3>results</h3>
      <div id="lines"></div>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/nav.js"></script>
  <script>
    function quat_to_euler() {
      const err = document.getElementById("err");
      err.textContent = "";
      document.getElementById("results").style.display = "none";

      const w = val("qw"), x = val("qx"), y = val("qy"), z = val("qz");
      if (w === null || x === null || y === null || z === null) { err.textContent = "fill all four quaternion parts"; return; }

      const n = Math.sqrt(w * w + x * x + y * y + z * z);
      if (n < 1e-12) { err.textContent = "zero quaternion"; return; }

      const sinp = 2 * (w * y - z * x);
      const pitch = Math.abs(sinp) >= 1 ? Math.sign(sinp) * Math.PI / 2 : Math.asin(sinp);
      const roll = Math.atan2(2 * (w * x + y * z), 1 - 2 * (x * x + y * y));
      const yaw = Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z));

      render_lines("lines", [
        ["roll", fmt(roll * 180 / Math.PI, 6) + " &deg;"],
        ["pitch", fmt(pitch * 180 / Math.PI, 6) + " &deg;"],
        ["yaw", fmt(yaw * 180 / Math.PI, 6) + " &deg;"]
      ]);
    }

    function euler_to_quat() {
      const err = document.getElementById("err");
      err.textContent = "";
      document.getElementById("results").style.display = "none";

      const r = (val("roll") || 0) * Math.PI / 180;
      const p = (val("pitch") || 0) * Math.PI / 180;
      const y = (val("yaw") || 0) * Math.PI / 180;

      const cr = Math.cos(r / 2), sr = Math.sin(r / 2);
      const cp = Math.cos(p / 2), sp = Math.sin(p / 2);
      const cy = Math.cos(y / 2), sy = Math.sin(y / 2);

      const w = cr * cp * cy + sr * sp * sy;
      const x = sr * cp * cy - cr * sp * sy;
      const yy = cr * sp * cy + sr * cp * sy;
      const z = cr * cp * sy - sr * sp * cy;

      render_lines("lines", [
        ["q = [w, x, y, z]", "[" + [w, x, yy, z].map(function (v) { return fmt(v, 6); }).join(", ") + "]"]
      ]);
    }
  </script>
</body>
</html>
