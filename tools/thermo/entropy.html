<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>entropy change</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>entropy change</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>
    <div class="calc-equation">
<div class="eq">\Delta s = c_p \ln\frac{T_2}{T_1} - R \ln\frac{p_2}{p_1}</div>
    </div>
    <div class="cols calc-layout">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-entro"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area calc-sections-2 calc-has-tabs">
<div class="tabs calc-tabs" id="tabs">
      <span class="tab active" data-mode="ds">ideal gas Δs</span>
      <span class="tab" data-mode="isen">isentropic relation</span>
    </div>
<div class="section calc-section" id="panel_ds">
      <h2>ideal gas entropy change (constant cp)</h2>
      <div class="field">
        <label>cp</label>
        <input type="number" id="cp" step="any" value="1.005" data-solver="solve_ds" class="default-value" data-default="1.005">
      </div>
      <div class="field">
        <label>R</label>
        <input type="number" id="rg" step="any" value="0.287" data-solver="solve_ds" class="default-value" data-default="0.287">
      </div>
      <div class="field">
        <label>T1, T2</label>
        <div class="row">
          <input type="number" id="t1" step="any" value="300" data-solver="solve_ds" class="default-value" data-default="300">
          <input type="number" id="t2" step="any" value="600" data-solver="solve_ds" class="default-value" data-default="600">
          <select id="t_unit" style="width: 90px" data-solver="solve_ds">
            <option value="k">K</option>
            <option value="c">°C</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>p1, p2</label>
        <div class="row">
          <input type="number" id="p1" step="any" value="100" data-solver="solve_ds" class="default-value" data-default="100">
          <input type="number" id="p2" step="any" value="200" data-solver="solve_ds" class="default-value" data-default="200">
        </div>
      </div>
      </div>
<div class="section calc-section" id="panel_isen" style="display:none">
      <h2>isentropic relation (s1 = s2)</h2>
      <div class="field">
        <label>k (specific heat ratio)</label>
        <input type="number" id="k" placeholder="1.4" step="any" value="1.4" data-solver="solve_isen" class="default-value" data-default="1.4">
      </div>
      <div class="field">
        <label>T1, T2</label>
        <div class="row">
          <input type="number" id="it1" step="any" value="300" data-solver="solve_isen" class="default-value" data-default="300">
          <input type="number" id="it2" step="any" data-solver="solve_isen">
          <select id="it_unit" style="width: 90px" data-solver="solve_isen">
            <option value="k">K</option>
            <option value="c">°C</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>p1, p2</label>
        <div class="row">
          <input type="number" id="ip1" step="any" value="100" data-solver="solve_isen" class="default-value" data-default="100">
          <input type="number" id="ip2" step="any" value="500" data-solver="solve_isen" class="default-value" data-default="500">
        </div>
      </div>
      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="1">
          <div class="result-line"><span class="label">property changes</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="entropy.js"></script>
</body>
</html>
