<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rotational motion</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>rotational motion</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-rot"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">\sum \tau = I\alpha</div>

      <div class="field">
        <label>initial angular velocity ω0 (rad/s)</label>
        <input type="number" id="w0" step="any" value="0">
      </div>
      <div class="field">
        <label>angular acceleration α (rad/s²)</label>
        <input type="number" id="alpha" step="any" value="0">
      </div>
      <div class="field">
        <label>time t (s)</label>
        <input type="number" id="tt" step="any" value="0">
      </div>

      <div class="field">
        <label>rpm (converts to rad/s)</label>
        <input type="number" id="rpm" step="any" value="60">
      </div>

      <div class="field">
        <label>moment of inertia I and torque τ = Iα</label>
        <div class="row">
          <input type="number" id="inertia" step="any" value="2">
          <input type="number" id="torque" step="any" value="0">
        </div>
      </div>

      <button class="btn-primary" onclick="solve_rot()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="4">
          <div class="result-line"><span class="label">final ω</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">angular displacement θ</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">rpm in rad/s</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">torque τ = Iα</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="rotation.js"></script>
</body>
</html>
