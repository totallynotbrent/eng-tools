<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reynolds number</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>reynolds number</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">Re = \frac{\rho V L}{\mu}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-reynolds"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>density ρ</label>
        <input type="number" id="rho" step="any" value="1.225" data-solver="solve_re" class="default-value" data-default="1.225">
      </div>
      <div class="field">
        <label>velocity V (m/s)</label>
        <input type="number" id="vel" step="any" value="50" data-solver="solve_re" class="default-value" data-default="50">
      </div>
      <div class="field">
        <label>characteristic length L (m)</label>
        <input type="number" id="len" step="any" value="1" data-solver="solve_re" class="default-value" data-default="1">
      </div>
      <div class="field">
        <label>dynamic viscosity μ (optional)</label>
        <input type="number" id="mu" step="any" placeholder="1.789e-5" value="1.81e-5" data-solver="solve_re" class="default-value" data-default="1.81e-5">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="2">
          <div class="result-line"><span class="label">reynolds number Re</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">regime (pipe)</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="reynolds.js"></script>
</body>
</html>
