<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>standard atmosphere</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>standard atmosphere</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-isa"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="eq">T = T_0 - L h, \qquad p = p_0 \left(\frac{T}{T_0}\right)^{g/(RL)}</div>

      <div class="field">
        <label>altitude h (m)</label>
        <input type="number" id="alt" step="any" value="11000">
      </div>

      <button class="btn-primary" onclick="solve_isa()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="6">
          <div class="result-line"><span class="label">temperature T</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">pressure p</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">density ρ</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">speed of sound a</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">p / p0</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">ρ / ρ0</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="standard-atmosphere.js"></script>
</body>
</html>
