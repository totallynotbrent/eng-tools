<!doctype html>
<!--?xml version="1.0" encoding="UTF-8"?--><html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>energy balance</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>energy balance</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>
    <div class="calc-equation">
<div class="eq">Q - W = \Delta U</div>
    </div>
    <div class="cols calc-layout">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-energy"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area calc-sections-2 calc-has-tabs">
<div class="tabs calc-tabs" id="tabs">
      <span class="tab active" data-mode="closed">closed system</span>
      <span class="tab" data-mode="flow">steady flow</span>
    </div>
<div class="section calc-section" id="panel_closed">
      <h2>closed system</h2>
      <div class="field">
        <label>mass m (kg)</label>
        <input type="number" id="m" step="any" value="2">
      </div>
      <div class="field">
        <label>energy change mode</label>
        <select id="emode" onchange="emode_ui()">
          <option value="u">internal energies u1, u2</option>
          <option value="gas">ideal gas cv, T1, T2</option>
        </select>
      </div>
      <div id="fields_u">
        <div class="field">
          <label>u1 (kJ/kg)</label>
          <input type="number" id="u1" step="any" value="200">
        </div>
        <div class="field">
          <label>u2 (kJ/kg)</label>
          <input type="number" id="u2" step="any" value="250">
        </div>
      </div>
      <div id="fields_gas" style="display:none">
        <div class="field">
          <label>cv</label>
          <input type="number" id="cv" step="any" value="0.718">
        </div>
        <div class="field">
          <label>T1 (K)</label>
          <input type="number" id="t1" step="any" value="300">
        </div>
        <div class="field">
          <label>T2 (K)</label>
          <input type="number" id="t2" step="any" value="500">
        </div>
      </div>
      <div class="field">
        <label>heat Q (leave blank to solve) (kJ)</label>
        <input type="number" id="q" step="any" value="130">
      </div>
      <div class="field">
        <label>work W (leave blank to solve) (kJ)</label>
        <input type="number" id="w" step="any" value="30">
      </div>
      <button class="btn-primary" onclick="solve_closed()">solve</button>
    </div>
<div class="section calc-section" id="panel_flow" style="display:none">
      <h2>steady flow</h2>
      <div class="field">
        <label>h1, h2</label>
        <div class="row">
          <input type="number" id="h1" step="any" value="300">
          <input type="number" id="h2" step="any" value="500">
        </div>
      </div>
      <div class="field">
        <label>velocity V1, V2</label>
        <div class="row">
          <input type="number" id="v1" step="any" value="10">
          <input type="number" id="v2" step="any" value="20">
        </div>
      </div>
      <div class="field">
        <label>elevation z1, z2</label>
        <div class="row">
          <input type="number" id="z1" step="any" value="0">
          <input type="number" id="z2" step="any" value="5">
        </div>
      </div>
      <div class="field">
        <label>gravity g</label>
        <input type="number" id="g" value="9.81" step="any">
      </div>
      <div class="field">
        <label>heat q (leave blank to solve) (kJ/kg)</label>
        <input type="number" id="qf" step="any">
      </div>
      <div class="field">
        <label>work w (leave blank to solve) (kJ/kg)</label>
        <input type="number" id="wf" step="any" value="0">
      </div>
      <button class="btn-primary" onclick="solve_flow()">solve</button>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="11">
          <div class="result-line"><span class="label">change in internal energy ΔU</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">heat Q</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">work W</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">change in enthalpy Δh</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">kinetic energy change Δke</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">potential energy change Δpe</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">q − w</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">heat q</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">work w</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">Q − W</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">check vs ΔU</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="energy-balance.js"></script>
</body>
</html>
