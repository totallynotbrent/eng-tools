<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>range and endurance</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>range and endurance</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">R = \frac{V}{c}\,\frac{L}{D}\ln\frac{W_0}{W_1}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-range"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>propulsion</label>
        <select id="mode" data-solver="solve_range">
          <option value="jet">jet</option>
          <option value="prop">propeller</option>
        </select>
      </div>
      <div class="field">
        <label>cruise velocity V (m/s)</label>
        <input type="number" id="vel" step="any" value="200" data-solver="solve_range" class="default-value" data-default="200">
      </div>
      <div class="field">
        <label>lift to drag L/D</label>
        <input type="number" id="ld" step="any" value="15" data-solver="solve_range" class="default-value" data-default="15">
      </div>
      <div class="field">
        <label>start weight W0 and end weight W1</label>
        <div class="row">
          <input type="number" id="w0" step="any" value="10000" data-solver="solve_range" class="default-value" data-default="10000">
          <input type="number" id="w1" step="any" value="8000" data-solver="solve_range" class="default-value" data-default="8000">
        </div>
      </div>
      <div class="field">
        <label>specific fuel consumption c (1/s)</label>
        <input type="number" id="sfc" step="any" value="1.7e-5" data-solver="solve_range" class="default-value" data-default="1.7e-5">
      </div>
      <div class="field">
        <label>propeller efficiency η (prop only)</label>
        <input type="number" id="eta" step="any" value="0.8" data-solver="solve_range" class="default-value" data-default="0.8">
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="2">
          <div class="result-line"><span class="label">range</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">block time</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="range-endurance.js"></script>
</body>
</html>
