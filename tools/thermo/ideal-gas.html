<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ideal gas solver</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>ideal gas solver</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-ideal"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">
      <h2>state</h2>

      <div class="eq">p V = m R T</div>

      <div class="field">
        <label>pressure p</label>
        <div class="row">
          <input type="number" id="p" class="blank" value="100">
          <select id="p_unit" style="width: 130px">
            <option value="kpa">kPa</option>
            <option value="mpa">MPa</option>
            <option value="bar">bar</option>
            <option value="atm">atm</option>
            <option value="psia">psia</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>volume V (m³)</label>
        <input type="number" id="vol" step="any" value="2">
      </div>

      <div class="field">
        <label>mass m (kg)</label>
        <input type="number" id="mass" step="any">
      </div>

      <div class="field">
        <label>temperature T</label>
        <div class="row">
          <input type="number" id="temp" class="blank" value="300">
          <select id="t_unit" style="width: 130px">
            <option value="k">K</option>
            <option value="c">°C</option>
            <option value="f">°F</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>gas (specific gas constant)</label>
        <select id="gas" onchange="custom_gas()">
          <option value="0.287">air (0.287)</option>
          <option value="0.2968">nitrogen (0.2968)</option>
          <option value="0.2598">oxygen (0.2598)</option>
          <option value="0.1889">carbon dioxide (0.1889)</option>
          <option value="2.0769">helium (2.0769)</option>
          <option value="4.1241">hydrogen (4.1241)</option>
          <option value="0.5182">methane (0.5182)</option>
          <option value="custom">custom</option>
        </select>
        <input type="number" id="r_custom" step="any" style="display:none; margin-top:0.5rem" value="287">
      </div>

      <button class="btn-primary" onclick="solve()">solve</button>
      <div id="err" class="error"></div>
    </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">

        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="6">
          <div class="result-line"><span class="label">pressure</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">volume</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">mass</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">temperature</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">specific volume v = V/m</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">density ρ = m/V</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="ideal-gas.js"></script>
</body>
</html>
