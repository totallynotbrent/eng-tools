<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stress concentration</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../css/calculator.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@400;500&amp;display=swap">
</head>
<body>
  <div class="wrap with-cols">
    <header class="top">
      <h1>stress concentration</h1>
      <a class="back" href="../../index.html">← all tools</a>
    </header>

    <div class="calc-equation"><div class="eq">\sigma_{\max} = K_t\,\sigma_{\mathrm{nom}}</div>

      </div><div class="cols calc-layout calc-compact">
      <section class="calc-panel calc-fig-panel">
        <div class="figure calc-figure" id="fig-kt"></div>
      </section>
      <section class="calc-panel calc-input-panel">
        <div class="calc-input-area">
<div class="section calc-section">

      <div class="field">
        <label>nominal stress σ_nom (Pa)</label>
        <input type="number" id="snom" step="any" value="100000000.0" data-solver="solve_kt" class="default-value" data-default="100000000.0">
      </div>
      <div class="field">
        <label>stress concentration factor Kt (enter, or estimate below)</label>
        <input type="number" id="kt" step="any" value="2.5" data-solver="solve_kt" class="default-value" data-default="2.5">
      </div>

      <div class="field">
        <label>for a circular hole: hole diameter d and plate width w (estimates Kt)</label>
        <div class="row">
          <input type="number" id="d" step="any" value="0.05" data-solver="solve_kt" class="default-value" data-default="0.05">
          <input type="number" id="w" step="any" value="0.1" data-solver="solve_kt" class="default-value" data-default="0.1">
        </div>
      </div>

      </div>
        </div>
      </section>
      <section class="calc-panel calc-output-panel">
        <div id="err" class="error"></div>
        <div class="results calc-results" id="results">
          <h3>results</h3>
          <div id="lines" data-result-contract="2">
          <div class="result-line"><span class="label">stress concentration Kt</span><span class="value">-</span></div>
          <div class="result-line"><span class="label">peak stress σ_max</span><span class="value">-</span></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="../../js/common.js"></script>
  <script src="../../js/figures.js"></script>
  <script src="../../js/catalog.js"></script>
  <script src="../../js/nav.js"></script>
  <script src="../../js/autosolve.js"></script>
  <script src="stress-concentration.js"></script>
</body>
</html>
